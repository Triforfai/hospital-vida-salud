
spring:
  application:
    name: auditoria-service

  rabbitmq:
    host: localhost
    port: 5672
    username: hospital
    password: "${RABBITMQ_PASSWORD:CHANGE_ME}"

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/hospital_pacientes
    username: postgres
    password: "${DB_PASSWORD:CHANGE_ME}"

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
