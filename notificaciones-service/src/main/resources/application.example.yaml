
spring:
  application:
    name: notificaciones-service

  rabbitmq:
    host: localhost
    port: 5672
    username: hospital
    password: "${RABBITMQ_PASSWORD:CHANGE_ME}"

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
